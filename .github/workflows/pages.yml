name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pages-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Quartz
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz quartz

      - name: Prepare content and settings
        run: |
          rm -rf quartz/content
          mkdir quartz/content
          rsync -a --exclude=.git --exclude=.github --exclude=README.md pages-src/ quartz/content/
          { printf -- '---\ntitle: Philippine Legal Wiki\n---\n'; sed '1{/^# /d}' pages-src/README.md; } > quartz/content/index.md
          cd quartz
          sed -i 's|pageTitle: "Quartz 4"|pageTitle: "Philippine Legal Wiki"|; s|baseUrl: "quartz.jzhao.xyz"|baseUrl: "tristane78.github.io/philippine-legal-wiki-trwe"|; /Plugin.CustomOgImages()/d; s|markdownLinkResolution: "shortest"|markdownLinkResolution: "relative"|' quartz.config.ts

      - name: Show links to unpublished pages as plain text
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("quartz/content")
          pages = {p.relative_to(root).as_posix() for p in root.rglob("*.md")}
          link = re.compile(r'(?<!!)\[((?:[^\[\]]|\[[^\]]*\])*)\]\(([^)\s#]+\.md)(#[^)\s]*)?\)')
          kept = dropped = 0
          for p in root.rglob("*.md"):
              rel = p.relative_to(root).as_posix()
              base = rel.rsplit("/", 1)[0] if "/" in rel else ""
              text = p.read_text(encoding="utf-8")
              def fix(m):
                  global kept, dropped
                  target = m.group(2)
                  if re.match(r"[a-z]+://", target):
                      return m.group(0)
                  parts = [] if target.startswith("/") else base.split("/") if base else []
                  for seg in target.lstrip("/").split("/"):
                      if seg == "..":
                          if parts: parts.pop()
                      elif seg not in ("", "."):
                          parts.append(seg)
                  if "/".join(parts) in pages:
                      kept += 1
                      return m.group(0)
                  dropped += 1
                  return m.group(1)
              new = link.sub(fix, text)
              if new != text:
                  p.write_text(new, encoding="utf-8")
          print(f"links kept: {kept}, links to unpublished pages shown as text: {dropped}")
          PY

      - name: Sort navigation and folder lists by article number
        run: |
          python3 - <<'PY'
          from pathlib import Path
          layout = Path("quartz/quartz.layout.ts")
          text = layout.read_text()
          before = "Component.Explorer()"
          after = 'Component.Explorer({ sortFn: (a, b) => { if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1; return a.slugSegment.localeCompare(b.slugSegment, undefined, { numeric: true, sensitivity: "base" }) } })'
          assert text.count(before) == 2
          layout.write_text(text.replace(before, after))
          config = Path("quartz/quartz.config.ts")
          text = config.read_text()
          before = "Plugin.FolderPage()"
          after = 'Plugin.FolderPage({ sort: (a, b) => (a.slug ?? "").localeCompare(b.slug ?? "", undefined, { numeric: true, sensitivity: "base" }) })'
          assert text.count(before) == 1
          config.write_text(text.replace(before, after))
          PY

      - name: Justify article paragraphs
        run: |
          printf '\narticle p { text-align: justify; }\n' >> quartz/quartz/styles/custom.scss

      - name: Build site
        working-directory: quartz
        run: |
          npm ci
          npx quartz build
      - name: Version stylesheet links
        run: |
          find quartz/public -name '*.html' -exec sed -i "s|index.css\"|index.css?v=${GITHUB_SHA}\"|g" {} +

      - name: Add Google verification file
        run: |
          cp pages-src/googleffb8e289051d2773.html quartz/public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
